<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>FreeCAD-Grundkurs – 13 Schritte mit echten Screenshots</title>
<style>
:root{
  --bg:#121519; --panel:#1a1f24; --line:#333b45;
  --text:#e7ebf0; --muted:#96a1ae; --accent:#5b9bd5; --accent2:#82c0f5;
  --orange:#f0a83c; --green:#4cd07d; --red:#e06c5a;
  --mono:"Cascadia Mono",Consolas,"SF Mono",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;overflow:hidden;color:var(--text);
  background:radial-gradient(1100px 620px at 18% -12%,#1d2733 0%,var(--bg) 58%) fixed;
  font:14px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;
}
button{font:inherit;color:inherit}
.ico{width:1.15em;height:1.15em;vertical-align:-0.22em;flex:none}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}

/* ---------- Kopfzeile ---------- */
header.top{
  display:flex;align-items:center;gap:18px;padding:9px 18px;flex:none;
  background:rgba(18,21,25,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.brand .logo{width:28px;height:28px}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em}
.progresswrap{flex:1;display:flex;align-items:center;gap:12px;max-width:520px;min-width:90px}
.progress{flex:1;height:6px;background:#2a313a;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#427cb8,#82c0f5);transition:width .35s ease}
.progressnum{font:600 12px var(--mono);color:var(--muted);white-space:nowrap}
.top-actions{display:flex;gap:8px;margin-left:auto}

.btn{
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#262c33;
  padding:8px 13px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.btn:hover{background:#2f3741;border-color:#46515d}
.btn.primary{background:linear-gradient(180deg,#3f80c0,#346da7);border-color:#4c90d1;color:#fff}
.btn.primary:hover{background:linear-gradient(180deg,#4a8ccd,#3c7ab8)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.35;cursor:default}
.btn.small{padding:5px 10px;font-size:12px;border-radius:6px}

/* ---------- Layout ---------- */
.app{flex:1;display:grid;grid-template-columns:232px minmax(0,1fr) 392px;min-height:0}
.outline{border-right:1px solid var(--line);background:rgba(23,26,31,.72);padding:16px 10px 24px;overflow:auto}
.outline h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin:2px 8px 10px}
.steplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.stepitem{
  display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;
  color:var(--muted);padding:7px 8px;border-radius:8px;cursor:pointer;transition:.13s;
}
.stepitem:hover{background:#232a31;color:var(--text)}
.stepitem.current{background:#22313f;color:#fff;box-shadow:inset 2px 0 0 var(--accent)}
.stepitem.done{color:#b9c5d2}
.stepitem .n{
  width:22px;height:22px;flex:none;border-radius:50%;border:1px solid #3a434e;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--muted);background:#1c2228;
}
.stepitem.current .n{background:var(--accent);border-color:var(--accent);color:#0d1520}
.stepitem.done .n{background:#1e3929;border-color:#2f5d43;color:#6bdc9a}
.stepitem .t{font-size:12.5px;line-height:1.25}
.outline .foot{font-size:11px;color:#6d7884;margin:18px 8px 0;line-height:1.5}

/* ---------- Bildbühne ---------- */
.stage{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:22px 26px;overflow:auto;min-width:0;gap:10px;
}
.stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(760px 420px at 50% 42%,rgba(91,155,213,.08),transparent 70%);
}
.shot{
  position:relative;margin:0;width:100%;max-width:1120px;
  border:1px solid #2f3944;border-radius:10px;overflow:hidden;cursor:zoom-in;
  box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03) inset;
  background:#0d1013;
}
.shot img{display:block;width:100%;height:auto;transition:opacity .22s ease}
.shot .zoom{
  position:absolute;right:10px;bottom:10px;background:rgba(12,16,20,.82);border:1px solid #43505e;
  color:#dbe4ee;font-size:11.5px;padding:5px 9px;border-radius:6px;display:flex;gap:6px;align-items:center;
  opacity:0;transition:.18s;backdrop-filter:blur(4px);
}
.shot:hover .zoom{opacity:1}
.shot-cap{
  font-size:11.5px;color:#7f8b98;text-align:center;max-width:900px;margin:0;
}
.shot-cap b{color:#b9c4d0;font-weight:600}

/* ---------- Lesebereich ---------- */
.reader{border-left:1px solid var(--line);background:linear-gradient(180deg,#1a1e23,#15181c);overflow:auto;padding:22px 24px 44px}
.reader-inner{max-width:344px}
.kicker{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
.reader h2{font-size:23px;line-height:1.25;margin:7px 0 10px;letter-spacing:-.01em}
.lead{color:#c3ccd6;font-size:13.5px;margin:0 0 16px}
.bullets{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:10px}
.bullets li{position:relative;padding-left:24px;color:#d7dee6;font-size:13.5px}
.bullets li::before{content:"";position:absolute;left:5px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.note{border-radius:10px;padding:11px 13px;margin:0 0 12px;font-size:12.5px;border:1px solid;line-height:1.5}
.note b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.11em;margin-bottom:3px}
.note p{margin:0;color:#c9d2db}
.note.tip{border-color:#2b5a3f;background:#182a20}
.note.tip b{color:#6fd69a}
.note.warn{border-color:#5a4126;background:#291f16}
.note.warn b{color:#f0b05a}
.keys{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 14px;font-size:12px;color:var(--muted)}
kbd{
  font:600 11px var(--mono);background:#232930;border:1px solid #46505b;border-bottom-width:2px;
  border-radius:4px;padding:2px 6px;color:#e3e9ef;
}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.advance-hint{font-size:11px;color:#6f7a86;margin-top:10px;line-height:1.45;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
h3{font-size:13px;letter-spacing:.02em;margin:22px 0 8px;color:#e9eef4}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 18px}
.specs div{background:#20262d;border:1px solid #333c45;border-radius:10px;padding:9px 10px}
.specs span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.specs b{font-size:16px;font-family:var(--mono);color:#fff}
.final-badge{
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:27px;color:#d6ffe2;
  background:linear-gradient(180deg,#2f7d32,#245f28);box-shadow:0 12px 32px rgba(47,125,50,.35);margin-bottom:14px;
}
.recap{margin:0 0 6px;padding-left:18px;color:#c9d2db;font-size:13px;display:flex;flex-direction:column;gap:5px}
table.shortcuts{width:100%;border-collapse:collapse;font-size:12px}
table.shortcuts td{padding:5px 0;border-bottom:1px solid #262d35;color:#c5ced8}
table.shortcuts td:first-child{width:52%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:11.5px;border:1px solid #3a444f;background:#20262c;color:#c2ccd7;border-radius:99px;padding:4px 10px}

/* ---------- Lightbox ---------- */
.lightbox{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(5,8,12,.9);backdrop-filter:blur(4px);padding:24px;
}
.lightbox.show{display:flex}
.lightbox img{max-width:96vw;max-height:88vh;border-radius:6px;box-shadow:0 30px 90px rgba(0,0,0,.8)}
.lb-close{
  position:absolute;top:14px;right:16px;width:38px;height:38px;border-radius:50%;border:1px solid #3f4a56;
  background:rgba(20,25,31,.85);color:#dfe7ef;font-size:18px;cursor:pointer;
}
.lb-close:hover{background:#2c3640}
.lb-nav{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;
  background:rgba(18,22,27,.92);border:1px solid #36414c;border-radius:99px;padding:5px 8px;font-size:12px;color:#b9c4cf;
}
.lb-nav button{width:34px;height:34px;border-radius:50%;border:0;background:#2a333c;color:#e8eef5;cursor:pointer;font-size:15px}
.lb-nav button:hover{background:#3a4652}
.lb-nav span{min-width:70px;text-align:center}

/* ---------- Responsiv ---------- */
@media (max-width:1360px){
  .app{grid-template-columns:212px minmax(0,1fr) 366px}
  .reader{padding:20px 18px 40px}
}
@media (max-width:1120px){
  .app{grid-template-columns:minmax(0,1fr) 356px}
  .outline{display:none}
}
@media (max-width:900px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:auto auto}
  .stage{padding:14px;min-height:0}
  .reader{border-left:0;border-top:1px solid var(--line);overflow:visible;padding:20px 18px 60px}
  .brand small{display:none}
  .top-actions .btn .lbl{display:none}
  .shot .zoom{opacity:1}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

        'Oben rechts im Panel auf <b>Schließen</b> klicken – oder das Werkzeug <b>Skizze schließen</b> in der Symbolleiste.',
        'Die Ansicht dreht zurück in die Isometrie.',
        'Im Modellbaum steht die Skizze jetzt unterhalb des Körpers.'
      ],
      tip:'Bearbeiten kannst du sie jederzeit per Doppelklick auf „Skizze“ im Modellbaum. Sie bleibt vollständig erhalten.',
      warn:'Eine nicht ganz grüne Skizze lässt sich ebenfalls aufpolstern – nur spätere Änderungen werden dann mühsam.'
    },
    {
      short:'Aufpolstern', title:'Aufpolstern (Pad)', section:'3D-Körper',
      img:'assets/10_aufpolstern.jpg',
      alt:'Dialog Parameter der Aufpolsterung mit Tiefe 10 mm und grüner Vorschau des Quaders',
      caption:'Parameter der Aufpolsterung: Tiefe 10 mm, Vorschau im 3D-Fenster',
      lead:'Aus der flachen Skizze wird ein 3D-Körper.',
      bullets:[
        'Werkzeug <b>Aufpolstern</b> (englisch <i>Pad</i>) wählen.',
        'Rechts öffnet sich das Panel <b>Parameter der Aufpolsterung</b>.',
        'Im 3D-Fenster zeigt FreeCAD eine grüne Vorschau des Volumens.'
      ],
      tip:'Aufpolstern zieht die Skizze senkrecht nach oben. Das Gegenstück ist die Tasche (Pocket): Sie schneidet nach innen.',
      warn:'Werkzeuge sind grau, wenn kein Körper aktiv ist. Dann im Modellbaum auf „Körper“ doppelklicken.'
    },
    {
      short:'Höhe 10 mm', title:'Höhe 10 mm eintragen und bestätigen', section:'3D-Körper',
      img:'assets/11_quader.jpg',
      alt:'Fertiger Quader 50 x 40 x 10 mm in der Isometrie, Modellbaum zeigt Aufpolstern',
      caption:'Fertig: Quader 50 × 40 × 10 mm',
      lead:'Höhe festlegen und bestätigen – der Quader ist fertig.',
      bullets:[
        'Im Feld <b>Tiefe</b> den Wert <b>10,00 mm</b> eintragen.',
        'Mit <b>OK</b> oben rechts bestätigen.',
        'Im Modellbaum erscheint <b>Aufpolster</b>. Das Ergebnis: <b>50 × 40 × 10 mm</b>.'
      ],
      tip:'Doppelklick auf „Aufpolster“ im Modellbaum öffnet die Parameter wieder – so änderst du die Höhe jederzeit.',
      keys:['Enter']
    },
    {
      short:'Ansicht & Navigation', title:'Ergebnis ansehen und navigieren', section:'3D-Körper',
      img:'assets/12_ansicht.jpg',
      alt:'Quader aus einer anderen Richtung, NaviCube oben rechts zeigt RECHTS',
      caption:'Ansicht gedreht – der NaviCube oben rechts zeigt die Blickrichtung',
      lead:'Fertig! Jetzt das Ergebnis ansehen und die Navigation üben.',
      bullets:[
        '<b>Mausrad</b> = zoomen.',
        'Ansicht drehen: <b>NaviCube</b> oben rechts anklicken (Flächen und Pfeile) – oder mit gedrückter rechter Maustaste ziehen, je nach Navigationsstil.',
        'Mit <b>Alles einpassen</b> holst du das Modell zurück ins Bild.',
        'Die Standardansichten (Isometrisch, Vorne, Oben …) findest du im Menü <b>Ansicht</b>.'
      ],
      tip:'Der NaviCube zeigt OBEN, VORNE und RECHTS – ein Klick auf eine Fläche richtet die Ansicht exakt aus. Das ist die schnellste Art zu navigieren.',
      warn:'Modell verschwunden? Nicht suchen, sondern „Alles einpassen“ – meist ist die Ansicht nur weit weggezoomt.'
    },
    {
      short:'Speichern & weiter', title:'Speichern und weitermachen', section:'Abschluss',
      img:'assets/13_speichern.jpg',
      alt:'Datei-Menü in FreeCAD mit Speichern, Speichern unter und PDF exportieren',
      caption:'Datei-Menü: „Speichern“ (Strg+S) oder „Speichern unter …“',
      lead:'Zum Schluss sichern, damit nichts verloren geht.',
      bullets:[
        'Auf <b>Speichern</b> klicken oder <kbd>Strg</kbd>+<kbd>S</kbd>.',
        'Dateinamen wählen, z. B. <span class="mono">quader.FCStd</span>. FreeCAD speichert Modellbaum und Verlauf in einer Datei.',
        'Danach: Tasche, Bohrung, Verrundung … deiner Fantasie sind keine Grenzen gesetzt.'
      ],
      tip:'Vor dem Speichern lohnt ein Blick auf den Modellbaum: Skizze geschlossen, Körper aktiv, nichts versehentlich ausgeblendet.',
      keys:['Strg','S']
    }
  ];

  N = STEPS.length;
  var FINAL_IMG = 'assets/11_quader.jpg';
  var KEY = 'freecad-grundkurs-v2';

  var progress = 0;
  try {
    var saved = parseInt(localStorage.getItem(KEY) || '0', 10);
    if (!isNaN(saved) && saved >= 0 && saved <= N) progress = saved;
  } catch(e) {}
  try {
    var params = new URLSearchParams(location.search);
    var raw = params.get('schritt') || params.get('step') || '';
    if (raw === 'fertig' || raw === 'ende') {
      progress = N;
    } else {
      var linkStep = parseInt(raw, 10);
      if (!isNaN(linkStep)) progress = Math.max(0, Math.min(N - 1, linkStep - 1));
    }
  } catch(e) {}

  var reader = $('#reader');
  var shotImg = $('#shotImg');
  var shotCap = $('#shotCap');
  var lightbox = $('#lightbox');
  var lbImg = $('#lbImg');
  var lbCaption = $('#lbCaption');

  function isDone(){ return progress >= N; }

  /* ---------- Schrittliste ---------- */
  function renderOutline(){
    $('#steplist').innerHTML = STEPS.map(function(s, i){
      var cls = i < progress ? 'done' : (i === progress ? 'current' : '');
      var num = i < progress ? '✓' : (i + 1);
      return '<li><button class="stepitem '+cls+'" data-jump="'+i+'">'+
             '<span class="n">'+num+'</span><span class="t">'+s.short+'</span></button></li>';
    }).join('');
  }

  /* ---------- Bild ---------- */
  function currentImage(){
    return isDone() ? FINAL_IMG : STEPS[progress].img;
  }

  function renderShot(){
    var img = currentImage();
    if (shotImg.getAttribute('src') !== img) {
      shotImg.style.opacity = '0';
      shotImg.src = img;
      setTimeout(function(){ shotImg.style.opacity = '1'; }, 30);
    }
    var alt = isDone() ? 'Fertiger Quader 50 x 40 x 10 mm' : STEPS[progress].alt;
    shotImg.alt = alt;
    shotCap.innerHTML = isDone()
      ? '<b>Fertig</b> · 50 × 40 × 10 mm · FreeCAD 1.1'
      : '<b>Echter Screenshot</b> · ' + STEPS[progress].caption;
    if (lightbox.classList.contains('show')) updateLightbox();
  }

  function updateLightbox(){
    lbImg.src = currentImage();
    lbImg.alt = isDone() ? 'Fertiger Quader' : STEPS[progress].alt;
    lbCaption.textContent = (isDone() ? N : progress + 1) + ' / ' + N;
  }

  /* ---------- Lesetext ---------- */
  function keysHTML(keys){
    return keys.map(function(k){ return '<kbd>'+k+'</kbd>'; }).join('<span style="color:#5d6874">+</span>');
  }

  function renderReader(){
    if (isDone()) { reader.innerHTML = finalCard(); reader.scrollTop = 0; return; }
    var s = STEPS[progress];
    reader.innerHTML = '<div class="reader-inner">'+
      '<div class="kicker">Schritt '+(progress+1)+' von '+N+' · '+s.section+'</div>'+
      '<h2>'+s.title+'</h2>'+
      '<p class="lead">'+s.lead+'</p>'+
      '<ul class="bullets">'+s.bullets.map(function(b){ return '<li>'+b+'</li>'; }).join('')+'</ul>'+
      (s.tip ? '<div class="note tip"><b>Gut zu wissen</b><p>'+s.tip+'</p></div>' : '')+
      (s.warn ? '<div class="note warn"><b>Achtung</b><p>'+s.warn+'</p></div>' : '')+
      (s.keys ? '<div class="keys"><span>Kürzel:</span>'+keysHTML(s.keys)+'</div>' : '')+
      '<div class="keys"><span>Maus:</span><kbd>M1</kbd> links <kbd>M2</kbd> rechts <kbd>Esc</kbd> abbrechen</div>'+
      '<div class="actions">'+
        '<button class="btn ghost" data-nav="prev" '+(progress === 0 ? 'disabled' : '')+'>← Zurück</button>'+
        '<button class="btn primary" data-nav="next">Weiter →</button>'+
      '</div>'+
      '<p class="advance-hint"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Bild anklicken, um es groß zu sehen. Mit ← → blätterst du.</p>'+
    '</div>';
    reader.scrollTop = 0;
  }

  function finalCard(){
    var recap = [
      'Neues Dokument und Arbeitsbereich <b>Part Design</b>',
      'Körper anlegen, Skizze auf der <b>XY-Ebene</b>',
      'Zentriertes Rechteck um den Ursprung',
      'Bemaßung <b>50 × 40 mm</b> – Skizze wird grün',
      'Skizze schließen und <b>10 mm aufpolstern</b>',
      'Speichern als <span class="mono">.FCStd</span>'
    ];
    var sc = [
      ['Neues Dokument','Strg + N'],
      ['Öffnen','Strg + O'],
      ['Speichern','Strg + S'],
      ['Rückgängig','Strg + Z'],
      ['Befehl abbrechen','Esc'],
      ['Zoomen','Mausrad'],
      ['Ansicht ausrichten','NaviCube']
    ];
    return '<div class="reader-inner">'+
      '<div class="final-badge">✓</div>'+
      '<div class="kicker">Geschafft</div>'+
      '<h2>Dein erster parametrischer Quader</h2>'+
      '<p class="lead">50 × 40 × 10 mm – aus einem Rechteck, zwei Bemaßungen und einem Aufpolstern. Genau so funktioniert jedes Part-Design-Bauteil.</p>'+
      '<div class="specs">'+
        '<div><span>Breite</span><b>50 mm</b></div>'+
        '<div><span>Höhe</span><b>40 mm</b></div>'+
        '<div><span>Tiefe</span><b>10 mm</b></div>'+
      '</div>'+
      '<h3>Der Ablauf in Kurzform</h3>'+
      '<ol class="recap">'+recap.map(function(r){ return '<li>'+r+'</li>'; }).join('')+'</ol>'+
      '<h3>Tastenkürzel</h3>'+
      '<table class="shortcuts">'+sc.map(function(r){ return '<tr><td>'+r[0]+'</td><td><kbd>'+r[1]+'</kbd></td></tr>'; }).join('')+'</table>'+
      '<h3>Nächste Schritte</h3>'+
      '<div class="chips"><span class="chip">Tasche (Pocket)</span><span class="chip">Bohrung</span><span class="chip">Verrundung</span><span class="chip">Muster</span><span class="chip">TechDraw-Zeichnung</span><span class="chip">Export als STL</span></div>'+
      '<div class="actions">'+
        '<button class="btn" data-nav="reset">↺ Nochmal von vorn</button>'+
        '<button class="btn primary" data-nav="last">Schritt 13 ansehen</button>'+
      '</div>'+
    '</div>';
  }

  /* ---------- Rendern ---------- */
  function render(){
    $('#bar').style.width = (Math.min(progress, N) / N * 100) + '%';
    $('#progressNum').textContent = (isDone() ? N : progress + 1) + ' / ' + N;
    renderOutline();
    renderReader();
    renderShot();
    try { localStorage.setItem(KEY, String(progress)); } catch(e) {}
  }

  function go(p){
    progress = Math.max(0, Math.min(N, p));
    render();
  }

  function openLightbox(){
    updateLightbox();
    lightbox.classList.add('show');
  }
  function closeLightbox(){ lightbox.classList.remove('show'); }

  /* ---------- Events ---------- */
  $('#steplist').addEventListener('click', function(e){
    var btn = e.target.closest('[data-jump]');
    if (btn) go(parseInt(btn.getAttribute('data-jump'), 10));
  });

  reader.addEventListener('click', function(e){
    var btn = e.target.closest('[data-nav]');
    if (!btn) return;
    var nav = btn.getAttribute('data-nav');
    if (nav === 'next') go(progress + 1);
    else if (nav === 'prev') go(progress - 1);
    else if (nav === 'last') go(N - 1);
    else if (nav === 'reset') { progress = 0; render(); }
  });

  document.addEventListener('keydown', function(e){
    if (e.target.matches && e.target.matches('input, textarea, select')) return;
    if (e.key === 'Escape') { closeLightbox(); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); go(progress + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(progress - 1); }
  });

  $('#shot').addEventListener('click', openLightbox);
  $('#zoomBtn').addEventListener('click', openLightbox);
  $('#lbClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', function(e){
    if (e.target === lightbox) closeLightbox();
  });
  $('#lbPrev').addEventListener('click', function(e){ e.stopPropagation(); go(progress - 1); });
  $('#lbNext').addEventListener('click', function(e){ e.stopPropagation(); go(progress + 1); });

  $('#resetBtn').addEventListener('click', function(){
    progress = 0;
    try { localStorage.removeItem(KEY); } catch(e) {}
    render();
  });

  /* Bilder vorladen */
  STEPS.forEach(function(s){ var im = new Image(); im.src = s.img; });

  render();
})();
</script>
</body>
</html>
